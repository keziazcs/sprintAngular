<div class="min-vh-100 bg-light">

  <nav class="navbar bg-white shadow-sm px-4 py-3">
    <div class="container-fluid">
      <img
        src="assets/img/ford.png"
        alt="Ford"
        style="width: 110px;"
      >

      <button
        class="btn btn-outline-secondary"
        type="button"
        (click)="logout()"
      >
        Sair
      </button>
    </div>
  </nav>

  <main class="container py-5">

    <div class="row align-items-center">

      <div class="col-lg-6">
        <p class="text-primary fw-semibold mb-2">
          FORD DASHBOARD
        </p>

        <h1 class="display-5 fw-bold mb-3">
          Bem-vindo ao sistema Ford
        </h1>

        <p class="lead text-secondary mb-4">
          Acompanhe informações dos veículos, dados de conectividade
          e atualizações em um único lugar.
        </p>

        <button
            class="'btn btn-primary btn-lg px-4"
            type=""button
            (click)="acessarDashboard()"
          >
            Acessar Dashboard
          </button>
        </div>

      <div class="col-lg-6 text-center mt-5 mt-lg-0">
        <img
          src="assets/img/mustang-sem-fundo.png"
          alt="Ford Mustang"
          class="img-fluid"
        >
      </div>

    </div>

  </main>

</div>
