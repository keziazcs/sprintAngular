<div class="min-vh-100 bg-light">

  <nav class="navbar bg-white shadow-sm px-4 py-3">
    <div class="container-fluid">

      <div class="d-flex align-items-center gap-3">
        <button
          class="menu-button"
          type="button"
          (click)="alternarMenu()"
          aria-label="Abrir menu"
        >
          ☰
        </button>

        <img
          src="assets/img/ford.png"
          alt="Ford"
          style="width: 110px;"
        >
      </div>

    </div>
  </nav>

  <!-- MENU LATERAL -->
  <aside class="side-menu" [class.open]="menuAberto">

    <div class="menu-header">
      <img src="assets/img/ford.png" alt="Ford">

      <button
        type="button"
        class="close-menu"
        (click)="alternarMenu()"
      >
        ×
      </button>
    </div>

    <nav class="menu-links">

      <a routerLink="/home" (click)="alternarMenu()">
        Início
      </a>

      <a routerLink="/dashboard" (click)="alternarMenu()">
        Dashboard
      </a>

      <button type="button" (click)="logout()">
        Sair
      </button>

    </nav>

  </aside>

  <div
    class="menu-overlay"
    *ngIf="menuAberto"
    (click)="alternarMenu()"
  ></div>

  <main class="container py-5">

    <div class="row align-items-center">

      <div class="col-lg-6">
        <p class="text-primary fw-semibold mb-2">
          FORD DASHBOARD
        </p>

        <h1 class="display-5 fw-bold mb-3">
          Bem-vindo ao sistema Ford
        </h1>

        <p class="lead text-secondary mb-4">
          Acompanhe informações dos veículos, dados de conectividade
          e atualizações em um único lugar.
        </p>

        <button
          class="btn btn-primary btn-lg px-4"
          type="button"
          (click)="acessarDashboard()"
        >
          Acessar Dashboard
        </button>
      </div>

      <div class="col-lg-6 text-center mt-5 mt-lg-0">
        <img
          src="assets/img/mustang-sem-fundo.png"
          alt="Ford Mustang"
          class="img-fluid"
        >
      </div>

    </div>

  </main>

</div>
